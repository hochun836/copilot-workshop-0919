<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-labelledby="page-title">
    <header class="app-header">
      <div class="title-row">
        <div class="title-copy">
          <p class="eyebrow">TODAY'S FOCUS</p>
          <h1 id="page-title">我的待辦清單</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
          <span id="theme-icon" class="theme-icon" aria-hidden="true">🌙</span>
          <span id="theme-label">深色模式</span>
        </button>
      </div>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">新增待辦事項</label>
      <input
        id="todo-input"
        class="todo-input"
        type="text"
        placeholder="接下來要完成什麼?"
        maxlength="120"
        required
      >
      <button class="add-button" type="submit">新增</button>
    </form>

    <div class="filters" role="group" aria-label="篩選待辦事項">
      <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <section class="todo-section" aria-labelledby="list-title">
      <div class="section-heading">
        <h2 id="list-title">待辦事項</h2>
        <span class="section-mark" aria-hidden="true"></span>
      </div>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state">還沒有任何待辦事項,新增一個吧!</p>
    </section>

    <footer class="app-footer">
      <span id="remaining-count">未完成:0 項</span>
    </footer>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
